<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 820" role="img" aria-label="月下窗边熟睡猫咪">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182641"/><stop offset="1" stop-color="#263a60"/></linearGradient>
  <linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22375f"/><stop offset="1" stop-color="#102039"/></linearGradient>
  <linearGradient id="cat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5c67f"/><stop offset="1" stop-color="#cf8d50"/></linearGradient>
  <radialGradient id="lamp" cx=".5" cy=".4" r=".7"><stop stop-color="#ffd98a" stop-opacity=".92"/><stop offset="1" stop-color="#ffba5b" stop-opacity=".1"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<style>
  .cat{animation:breathe 5.2s ease-in-out infinite}.tail{animation:tail 7s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}.star{animation:twinkle 4.6s ease-in-out infinite}.star:nth-child(2n){animation-delay:-2s}.lamp{animation:lamp 5s ease-in-out infinite}.blink{animation:blink 9s infinite}
  @keyframes breathe{50%{transform:translateY(-4px)}}@keyframes tail{50%{transform:rotate(5deg)}}@keyframes twinkle{50%{opacity:.35;transform:scale(.8)}}@keyframes lamp{50%{opacity:.78}}@keyframes blink{0%,48%,51%,100%{opacity:0}49%,50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
