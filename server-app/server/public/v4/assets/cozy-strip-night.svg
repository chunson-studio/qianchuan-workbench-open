<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 360" role="img" aria-label="月夜云朵猫狗陪伴横幅">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152443"/><stop offset=".55" stop-color="#20365f"/><stop offset="1" stop-color="#2a466e"/></linearGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf3ff"/><stop offset="1" stop-color="#c8d7f3"/></linearGradient>
  <linearGradient id="dog" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd88a"/><stop offset="1" stop-color="#e3a45b"/></linearGradient>
  <linearGradient id="cat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a7afb9"/><stop offset="1" stop-color="#646d79"/></linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a1427" flood-opacity=".28"/></filter>
</defs>
<style>
  .pets{animation:breathe 5.3s ease-in-out infinite}.clouds{animation:drift 20s ease-in-out infinite alternate}.star{animation:twinkle 4.8s ease-in-out infinite}.star:nth-child(odd){animation-delay:-2s}.blink{animation:blink 8.5s infinite}.tail{animation:tail 7s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
  @keyframes breathe{50%{transform:translateY(-4px)}}@keyframes drift{to{transform:translateX(22px)}}@keyframes twinkle{50%{opacity:.28;transform:scale(.75)}}@keyframes blink{0%,48%,51%,100%{opacity:0}49%,50%{opacity:1}}@keyframes tail{50%{transform:rotate(5deg)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
