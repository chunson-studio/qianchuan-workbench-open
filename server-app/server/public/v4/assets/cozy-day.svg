<g class="cloudB" opacity=".82" fill="#fff"><ellipse cx="1200" cy="190" rx="130" ry="75"/><ellipse cx="1320" cy="170" rx="170" ry="96"/><ellipse cx="1475" cy="208" rx="125" ry="72"/><ellipse cx="1790" cy="145" rx="116" ry="70"/></g>
