<path d="M0 475C290 430 380 520 650 476s410-18 630 0 485-66 820-14V620H0Z" fill="#e8f5dd"/><path d="M0 535c290-55 470 50 760-5s460 58 750 0 430-10 590 0v90H0Z" fill="url(#hill)" opacity=".72"/>
<g fill="#6eaa68" opacity=".96"><ellipse class="leaf" cx="70" cy="430" rx="32" ry="74" transform="rotate(-24 70 430)"/><ellipse class="leaf" cx="128" cy="408" rx="30" ry="70" transform="rotate(18 128 408)"/><ellipse class="leaf" cx="195" cy="452" rx="26" ry="62" transform="rotate(34 195 452)"/><ellipse class="leaf" cx="1980" cy="430" rx="34" ry="78" transform="rotate(20 1980 430)"/><ellipse class="leaf" cx="2036" cy="456" rx="28" ry="65" transform="rotate(-20 2036 456)"/></g>
