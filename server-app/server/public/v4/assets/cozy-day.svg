<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 620" role="img" aria-label="温暖日间云朵猫狗装饰">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset=".52" stop-color="#dcecff"/><stop offset="1" stop-color="#fff6e8"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cde8b1"/><stop offset="1" stop-color="#9bc77c"/></linearGradient>
  <linearGradient id="furDog" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd98a"/><stop offset="1" stop-color="#e8a85c"/></linearGradient>
  <linearGradient id="furCat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9aa2aa"/><stop offset="1" stop-color="#5f6670"/></linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7da4c7" flood-opacity=".18"/></filter>
</defs>
<style>
  .cloudA{animation:driftA 17s ease-in-out infinite alternate}.cloudB{animation:driftB 21s ease-in-out infinite alternate}.pets{animation:breathe 4.8s ease-in-out infinite}.leaf{animation:leaf 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.blink{animation:blink 7.2s infinite}.blink2{animation:blink 8.7s 1.4s infinite}
  @keyframes driftA{to{transform:translateX(20px)}}@keyframes driftB{to{transform:translateX(-18px)}}@keyframes breathe{50%{transform:translateY(-5px)}}@keyframes leaf{50%{transform:rotate(3deg)}}@keyframes blink{0%,45%,49%,100%{opacity:0}46%,48%{opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
