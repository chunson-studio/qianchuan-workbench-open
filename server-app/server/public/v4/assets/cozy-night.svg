<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 620" role="img" aria-label="温暖夜间月亮猫狗装饰">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e2345"/><stop offset=".55" stop-color="#142e58"/><stop offset="1" stop-color="#2d315b"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#253753"/><stop offset="1" stop-color="#142039"/></linearGradient>
  <radialGradient id="lamp"><stop stop-color="#ffd985" stop-opacity=".95"/><stop offset="1" stop-color="#ffd985" stop-opacity="0"/></radialGradient>
  <linearGradient id="furDog" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd98a"/><stop offset="1" stop-color="#d9954d"/></linearGradient>
  <linearGradient id="furCat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#909aa8"/><stop offset="1" stop-color="#565e6b"/></linearGradient>
</defs>
<style>
  .stars{animation:twinkle 5s ease-in-out infinite alternate}.pets{animation:breathe 5.2s ease-in-out infinite}.cloud{animation:drift 20s ease-in-out infinite alternate}.blink{animation:blink 8s infinite}.blink2{animation:blink 9s 1.7s infinite}.glow{animation:glow 4s ease-in-out infinite alternate}
  @keyframes twinkle{to{opacity:.58}}@keyframes breathe{50%{transform:translateY(-4px)}}@keyframes drift{to{transform:translateX(18px)}}@keyframes blink{0%,47%,51%,100%{opacity:0}48%,50%{opacity:1}}@keyframes glow{to{opacity:.78}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
